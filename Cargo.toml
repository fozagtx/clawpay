[package]
name = "clawpay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT tool plugin: Solana Pay stablecoin invoices for Brazilian informal workers — create, watch and confirm payments in Portuguese, with hard-capped optional yield sweeps."
publish = false

# cdylib for the wasm component; rlib so the pure payments core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.5"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
